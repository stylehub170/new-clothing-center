<!DOCTYPE html>
<html>
<head>
    <title>Order Now - StyleHub</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<h2>Place Your Order</h2>

<form action="https://formspree.io/f/xzdnnvzv" method="POST">

    <label>Full Name</label><br>
    <input type="text" name="name" placeholder="Enter your name" required><br><br>

    <label>Phone Number</label><br>
    <input type="tel" name="phone" placeholder="03XXXXXXXXX" required><br><br>

    <label>Email</label><br>
    <input type="email" name="email" placeholder="Enter your email" required><br><br>

    <label>Address</label><br>
    <textarea name="address" placeholder="Enter your address" required></textarea><br><br>

    <label>City</label><br>
    <input type="text" name="city" placeholder="Enter your city" required><br><br>

    <label>Quantity</label><br>
    <input type="number" name="quantity" min="1" value="1" required><br><br>

    <button type="submit">Place Order</button>

</form>

</body>
  </html>
