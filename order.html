<!DOCTYPE html>
<html>
<head>
    <title>Order Now - StyleHub</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<h2>Place Your Order</h2>

<form action="https://formspree.io/f/xzdnnvzv" method="POST">

    <label>Full Name</label><br>
    <input type="text" name="name" placeholder="Enter your name" required><br><br>

    <label>Phone Number</label><br>
    <input type="tel" name="phone" placeholder="03XXXXXXXXX" required><br><br>
<label>Product Name</label><br>
<input type="text" id="product" name="Product Name" readonly><br><br>
    <label>Email</label><br>
    <input type="email" name="email" placeholder="Enter your email" required><br><br>

    <label>Address</label><br>
    <textarea name="address" placeholder="Enter your address" required></textarea><br><br>

    <label>City</label><br>
    <input type="text" name="city" placeholder="Enter your city" required><br><br>

<select name="Size" required>
    <option value="">Select Size</option>
    <option value="S">S</option>
    <option value="M">M</option>
    <option value="L">L</option>
    <option value="XL">XL</option>
</select><br><br>
<label>Color</label><br>
<select name="Color" required>
    <option value="">Select Color</option>
    <option value="Black">Black</option>
    <option value="White">White</option>
    <option value="Blue">Blue</option>
    <option value="Red">Red</option>
</select><br><br>
    <label>Quantity</label><br>
    <input type="number" name="quantity" min="1" value="1" required><br><br>
    <label>Total Price</label><br>
<input type="text" id="totalPrice" name="Total Price" readonly><br><br>


    <label>Payment Method</label><br>
    <input type="text" name="payment_method" value="Cash on Delivery" readonly>

    <br><br>

    <button type="submit">Place Order</button>

</form>
<script>
document.getElementById("productName").value =
localStorage.getItem("productName");

document.getElementById("productPrice").value =
"Rs. " + localStorage.getItem("productPrice");
let price = parseInt(localStorage.getItem("productPrice"));

document.getElementById("totalPrice").value = "Rs. " + price;

document.getElementsByName("quantity")[0].addEventListener("input", function () {
    let quantity = this.value;
    document.getElementById("totalPrice").value = "Rs. " + (price * quantity);
}); 
</script>
let product = localStorage.getItem("productName");

document.getElementById("product").value = product;
</body>
        </html>
